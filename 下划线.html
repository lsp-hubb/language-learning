<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>波浪线下划线高亮风格</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #ffffff;
        color: #24292f;
        line-height: 2.2;
        padding: 40px;
        max-width: 800px;
        margin: auto;
      }
      h1 {
        margin-bottom: 8px;
      }
      .subtitle {
        color: #656d76;
        margin-bottom: 40px;
        font-size: 14px;
      }
      h2 {
        margin-top: 40px;
        margin-bottom: 16px;
        font-size: 18px;
        border-bottom: 1px solid #d0d7de;
        padding-bottom: 8px;
      }
      p {
        margin-bottom: 22px;
        font-size: 16px;
      }

      /* ===== 1. 经典警告黄 ===== */
      .wavy-warn {
        text-decoration: underline wavy #d4a72c;
        text-underline-offset: 5px;
      }
      /* ===== 2. 错误红 ===== */
      .wavy-error {
        text-decoration: underline wavy #cf222e;
        text-underline-offset: 5px;
      }
      /* ===== 3. 提示蓝 ===== */
      .wavy-info {
        text-decoration: underline wavy #0969da;
        text-underline-offset: 5px;
      }
      /* ===== 4. 成功绿 ===== */
      .wavy-success {
        text-decoration: underline wavy #1a7f37;
        text-underline-offset: 5px;
      }
      /* ===== 5. 柔和紫 ===== */
      .wavy-purple {
        text-decoration: underline wavy #8250df;
        text-underline-offset: 5px;
      }
      /* ===== 6. 粗波浪线 ===== */
      .wavy-bold {
        text-decoration: underline wavy #f08200;
        text-decoration-thickness: 3px;
        text-underline-offset: 6px;
      }
      /* ===== 7. 细波浪线 ===== */
      .wavy-thin {
        text-decoration: underline wavy #6e7781;
        text-decoration-thickness: 1px;
        text-underline-offset: 4px;
      }
      /* ===== 8. 双层波浪（波浪线 + 背景色） ===== */
      .wavy-bg {
        text-decoration: underline wavy #cf222e;
        text-underline-offset: 5px;
        background: #fff8c5;
        padding: 0 3px;
        border-radius: 2px;
      }
      /* ===== 9. 虚线波浪（波浪线 + 虚线下划线） ===== */
      .wavy-double {
        text-decoration: underline wavy #0969da;
        text-underline-offset: 8px;
        border-bottom: 1px dashed #0969da;
        padding-bottom: 2px;
      }
      /* ===== 10. 渐变波浪线（通过 border-image 模拟） ===== */
      .wavy-gradient {
        position: relative;
        display: inline-block;
      }
      .wavy-gradient::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: -4px;
        height: 4px;
        background: linear-gradient(90deg, #f66, #f90, #6c6);
        -webkit-mask: url("data:image/svg+xml,%3Csvg width='12' height='4' viewBox='0 0 12 4' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 2 Q3 0 6 2 T12 2' stroke='black' fill='none'/%3E%3C/svg%3E")
          repeat-x;
        mask: url("data:image/svg+xml,%3Csvg width='12' height='4' viewBox='0 0 12 4' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 2 Q3 0 6 2 T12 2' stroke='black' fill='none'/%3E%3C/svg%3E")
          repeat-x;
      }
    </style>
  </head>
  <body>
    <h1>〰️ 波浪线下划线标注风格</h1>
    <div class="subtitle">共 10 种 · 适用于拼写检查、审校批注、重点提示</div>

    <h2>基础颜色</h2>
    <p>拼写检查中，<span class="wavy-error">错误单词</span>通常用红色波浪线标记。</p>
    <p>语法建议会用<span class="wavy-warn">黄色波浪线</span>提示可能存在问题的句子。</p>
    <p>文档中需要<span class="wavy-info">注意的信息</span>可以用蓝色波浪线标注。</p>
    <p>审核通过的修改内容用<span class="wavy-success">绿色波浪线</span>表示确认无误。</p>
    <p>分类或标签信息可以用<span class="wavy-purple">紫色波浪线</span>来区分。</p>

    <h2>线条粗细</h2>
    <p><span class="wavy-bold">粗波浪线</span>适合用于非常重要的警告或阻断性错误。</p>
    <p><span class="wavy-thin">细波浪线</span>则适合轻量提示，不干扰阅读。</p>

    <h2>组合效果</h2>
    <p><span class="wavy-bg">波浪线加背景色</span>组合使用，在长文档中更容易被注意到。</p>
    <p><span class="wavy-double">波浪线加虚线</span>可以表示多层次的标注含义。</p>
    <p><span class="wavy-gradient">渐变波浪线</span>适合用在创意或品牌相关的页面中。</p>
  </body>
</html>
